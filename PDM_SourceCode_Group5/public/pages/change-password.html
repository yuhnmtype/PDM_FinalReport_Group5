<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Change Password — VoteSecure</title>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<nav class="navbar">
  <div class="nav-logo"><div class="nav-logo-icon">🗳️</div><div class="nav-logo-divider"></div><div><div>VoteSecure</div><div class="nav-logo-sub">Account Settings</div></div></div>
  <div class="nav-right">
    <div class="nav-user"><div class="nav-avatar" id="nav-avatar">?</div><span class="nav-user-name" id="nav-name">—</span></div>
    <button class="nav-btn" onclick="window.location.href='/pages/elections.html'">← Back</button>
    <button class="nav-btn danger" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="layout">
  <div class="container fade-in" style="max-width:600px">
    <div class="page-hdr">
      <div class="breadcrumb">🏠 <span>›</span> <a href="/pages/elections.html" style="color:var(--accent)">Elections</a> <span>›</span> Settings</div>
      <h1>Change Password</h1><p>Update your account credentials.</p>
    </div>
    <div class="card">
      <div class="card-header"><h3>Password Update</h3></div>
      <div class="card-body" style="padding:28px">
        <div class="alert alert-error" id="pw-error"></div>
        <div class="field"><label>Current Password</label><input type="password" id="pw-cur" placeholder="Enter current password"/></div>
        <div class="field"><label>New Password</label><input type="password" id="pw-new" placeholder="Min 6 characters"/></div>
        <div class="field"><label>Confirm New Password</label><input type="password" id="pw-con" placeholder="Repeat new password"/></div>
        <div class="action-bar">
          <button class="btn btn-ghost" onclick="window.location.href='/pages/elections.html'">Cancel</button>
          <button class="btn btn-primary" id="save-btn" onclick="doChange()">Save Changes</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modal-ok">
  <div class="modal">
    <span class="modal-icon">✅</span>
    <h3>Password Updated</h3>
    <p>Your password has been changed successfully in the database.</p>
    <button class="btn btn-primary btn-full" onclick="window.location.href='/pages/elections.html'">Continue →</button>
  </div>
</div>
<div class="toast" id="toast"><span class="toast-icon" id="toast-icon"></span><span id="toast-msg"></span></div>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => { Session.require(); initNavbar(); });
async function doChange() {
  const cur = document.getElementById('pw-cur').value;
  const nw  = document.getElementById('pw-new').value;
  const con = document.getElementById('pw-con').value;
  const err = document.getElementById('pw-error');
  err.classList.remove('show'); err.textContent = '';
  if (!cur||!nw||!con)  { err.textContent='⚠️ All fields are required.'; err.classList.add('show'); return; }
  if (nw.length < 6)    { err.textContent='⚠️ New password must be at least 6 characters.'; err.classList.add('show'); return; }
  if (nw !== con)       { err.textContent='⚠️ New passwords do not match.'; err.classList.add('show'); return; }
  if (nw === cur)       { err.textContent='⚠️ New password must differ from current.'; err.classList.add('show'); return; }
  setLoading('save-btn', true);
  try {
    const user = Session.get();
    await apiFetch('/change-password', {
      method: 'POST',
      body: JSON.stringify({ voter_id: user.id, current_password: cur, new_password: nw }),
    });
    document.getElementById('modal-ok').classList.add('show');
  } catch(e) {
    err.textContent = '⚠️ ' + e.message; err.classList.add('show');
    setLoading('save-btn', false);
  }
}
</script>
</body>
</html>
